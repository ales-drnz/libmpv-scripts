     The browser harness, served by serve_coi.py (run_browser.sh stages
     the files). Query:
       mode=spike   the C harness (spike/spike.mjs), main on a pthread
       mode=lib     lib_harness.mjs on the module (lib/libmpv.mjs), from the
                    main thread
       mode=audio   audio_harness.mjs: mpv's webaudio output on the module;
                    ao=null for the real-time ao=null run, gesture=1 when the
                    AudioContext waits for a user gesture (resume=0: the glue
                    does not resume on it)
       files=a,b    fixtures/ names; longs=c,d the timed files (spike only)
       loops=N      core create and destroy cycles (spike only)
       busy=1       keeps the main thread busy 50 ms every 100 ms
       memory=MiB   (spike, lib) the module gets a shared WebAssembly.Memory
                    of the page with that maximum, 32 MiB at start
     The result goes to POST /result as JSON. Meanwhile the lines go to
     POST /progress as they come, with a line every 5 s that says the page
     still runs: a run that never posts a result leaves how far it got. -->
<meta charset="utf-8">
<title>mak spike</title>
<pre id="out"></pre>
<script type="module">
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'spike';
const list = (k) => (q.get(k) || '').split(',').filter(Boolean);
const files = list('files'), longs = list('longs');
const lines = [];
const out = document.getElementById('out');
// The trace of a run with no result (serve_coi.py keeps it, run_browser.sh
// prints it): every line, numbered, with the page's clock, sent within half
// a second; a step and the alive line are sent at once.
const t00 = performance.now();
const unsent = [];
let seq = 0, flushing = 0, step = 'none', status = () => '';
const note = (s) => unsent.push(`${++seq}\t${((performance.now() - t00) / 1000).toFixed(1)}\t${s}`);
const flush = () => {
  clearTimeout(flushing);
  flushing = 0;
  if (!unsent.length) return;
  fetch('/progress', { method: 'POST', keepalive: true, body: unsent.splice(0).join('\n') }).catch(() => {});
};
const log = (s) => {
  lines.push(String(s));
  out.textContent += s + '\n';
  note(s);
  flushing ||= setTimeout(flush, 500);
};
// trace.step(name): the harness is about to make a call with no time limit
// of its own, which may never come back. trace.status = () => text: what
// the alive line says, every 5 s while the main thread runs.
const trace = {
  step: (name) => {
    step = name;
    note(`step ${name}`);
    flush();
  },
  set status(f) { status = f; },
};
setInterval(() => {
  let s;
  try { s = status(); } catch (e) { s = `status: ${e}`; }
  note(`alive, last step ${step}${s ? ', ' + s : ''}`);
  flush();
}, 5000);
let posted = false;
const post = async (extra) => {
  if (posted) return;
  posted = true;
  await fetch('/result', { method: 'POST', body: JSON.stringify({ mode, userAgent: navigator.userAgent,
    crossOriginIsolated, hardwareConcurrency: navigator.hardwareConcurrency, lines, ...extra }) });
};
window.addEventListener('error', (e) => { log(`page error: ${e.message}`); post({ code: -1 }); });
window.addEventListener('unhandledrejection', (e) => { log(`page rejection: ${e.reason}`); post({ code: -1 }); });
setTimeout(() => { log('page timeout'); post({ code: -2 }); }, Number(q.get('timeout') || 240) * 1000);

log(`crossOriginIsolated ${crossOriginIsolated}, hardwareConcurrency ${navigator.hardwareConcurrency}`);
let busyTicks = 0;
if (q.get('busy') === '1') {
  setInterval(() => { const t = performance.now(); while (performance.now() - t < 50) {} busyTicks++; }, 100);
}
const fetchBytes = async (name) => new Uint8Array(await (await fetch(`fixtures/${name}`)).arrayBuffer());
const memoryMiB = Number(q.get('memory') || 0);

try {
  if (mode === 'audio') {
    const { runAudioHarness } = await import('./audio_harness.mjs');
    const { default: factory } = await import('./lib/libmpv.mjs');
    const inputs = {};
    for (const f of files) inputs[f] = await fetchBytes(f);
    // The runner acts on a signal (a user gesture, the CPU samples).
    const signal = async (name) => { await fetch(`/signal?name=${name}`, { method: 'POST' }); };
    const r = await runAudioHarness(factory, inputs, log,
      { ao: q.get('ao') || 'webaudio', gesture: q.get('gesture') === '1', signal, trace,
        resumeOnGesture: q.get('resume') !== '0',
        slowProcessorUrl: new URL('lib/mak_webaudio_processor.js?delay=400', location.href).href });
    await post({ code: r.fail ? 1 : 0, busyTicks, measures: r.measures });
  } else if (mode === 'lib') {
    const { runLibHarness } = await import('./lib_harness.mjs');
    const { default: factory } = await import('./lib/libmpv.mjs');
    const inputs = [];
    for (const f of files) inputs.push({ name: f, bytes: await fetchBytes(f) });
    // The record beside the module, when the build wrote one.
    const rec = await fetch('lib/build_web.json');
    const r = await runLibHarness(factory, inputs, log, rec.ok ? await rec.json() : null, { memoryMiB });
    await post({ code: r.fail ? 1 : 0, busyTicks });
  } else {
    const t0 = performance.now();
    const { default: factory } = await import('./spike/spike.mjs');
    const memory = memoryMiB
      ? new WebAssembly.Memory({ initial: 512, maximum: memoryMiB * 16, shared: true }) : null;
    const mod = await factory({
      ...(memory ? { wasmMemory: memory } : {}),
      print: log, printErr: log,
      // The last lines of a pthread reach the page after onExit: wait a bit.
      onExit: (code) => setTimeout(() => { log(`page: harness exit ${code}`); post({ code, busyTicks }); }, 500),
    });
    log(`measure instantiate_ms ${(performance.now() - t0).toFixed(3)}`);
    // Taken, it holds the module's data; left alone, it is all zeros.
    if (memory && (mod.wasmMemory !== memory || !new Uint8Array(memory.buffer, 0, 4 << 20).some((b) => b))) {
      throw new Error(`memory: the page's memory of ${memoryMiB} MiB is not the module's`);
    }
    if (memory) log(`ok memory: the module runs in the page's memory of at most ${memoryMiB} MiB`);
    mod.FS.mkdir('/in');
    for (const f of [...files, ...longs]) mod.FS.writeFile(`/in/${f}`, await fetchBytes(f));
    const args = [];
    if (q.get('loops')) args.push('-n', q.get('loops'));
    for (const l of longs) args.push('-l', `/in/${l}`);
    for (const f of files) args.push(`/in/${f}`);
    mod.callMain(args);
  }
} catch (e) {
  log(`page exception: ${e && e.stack || e}`);
  post({ code: -1 });
}
</script>
