# Meson cross file for the web build (build_libmpv_web.sh). The emsdk tools
# come from PATH (emsdk_env.sh). The compile flags of the variant (-Oz, LTO,
# SIMD) are not here: the build script writes them to a second cross file in
# its build dir, so this one stays the same for every variant.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
nm = 'emnm'
strip = 'emstrip'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
