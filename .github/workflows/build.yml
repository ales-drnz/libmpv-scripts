name: Build

# Builds every libmpv binary the mpv_audio_kit release ships, on GitHub's
# runners (macOS ones included, so no Mac is needed), collects them with
# manifest.json into one artifact and checks them with verify_binaries.sh.
# Publishing the libmpv-<release> GitHub release stays a manual step.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every source tarball must be pinned in scripts/shared/_sources.sha256. A
# build that meets an unpinned one stops, and its unpinned-sources-<job>
# artifact holds the line to add.
env:
  STRICT_SOURCES: '1'
  # build-push-action uploads a build record per image as an artifact, which
  # gh run download without a name cannot extract.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

# The jobs only read the repository. The artifacts and the build cache use
# the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linux image is native-only, so each arch builds on its own.
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/
          target: linux
          tags: mpv-build-linux
          load: true
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-${{ matrix.arch }},mode=max
      - name: Build
        run: |
          docker run --rm \
            -e STRICT_SOURCES -e RECORD_SOURCES=/scripts/builds/sources-linux-${{ matrix.arch }}.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-linux bash scripts/build_libmpv_linux.sh --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            builds/release/libmpv_linux-${{ matrix.arch }}.so
            builds/release/build_linux-${{ matrix.arch }}.json
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unpinned-sources-linux-${{ matrix.arch }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/
          target: android
          tags: mpv-build-android
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
      - name: Build
        run: |
          docker run --rm --platform linux/amd64 \
            -e ABIS="arm64-v8a armeabi-v7a x86_64" \
            -e STRICT_SOURCES -e RECORD_SOURCES=/scripts/builds/sources-android.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-android bash scripts/build_libmpv_android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            builds/release/libmpv_android-*.so
            builds/release/build_android-*.json
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unpinned-sources-android
          path: builds/sources-*.txt
          if-no-files-found: ignore

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/
          target: windows
          tags: mpv-build-windows
          load: true
          cache-from: type=gha,scope=windows
          cache-to: type=gha,scope=windows,mode=max
      - name: Build
        run: |
          docker run --rm \
            -e STRICT_SOURCES -e RECORD_SOURCES=/scripts/builds/sources-windows-${{ matrix.arch }}.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-windows bash scripts/build_libmpv_windows.sh --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            builds/release/libmpv_windows-*.dll
            builds/release/build_windows-*.json
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unpinned-sources-windows-${{ matrix.arch }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The image is pinned, so a new macos-latest does not change the
  # toolchain of a release without a commit. Xcode and the brew tools still
  # follow the updates within the label: the Toolchain versions step logs
  # what each build used, and cannot fail the job.
  apple:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            script: scripts/build_libmpv_macos.sh
            output: builds/release/libmpv_macos.xcframework.zip
            record: builds/release/build_macos.json
          - name: iOS
            script: scripts/build_libmpv_ios.sh
            output: builds/release/libmpv_ios.xcframework.zip
            record: builds/release/build_ios.json
    steps:
      - uses: actions/checkout@v7
      - run: brew install meson ninja nasm cmake pkg-config autoconf automake libtool
      - name: Toolchain versions
        continue-on-error: true
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          for sdk in macosx iphoneos iphonesimulator; do
            echo "$sdk SDK $(xcrun --sdk "$sdk" --show-sdk-version)"
          done
          clang --version | head -1
          echo "meson $(meson --version), ninja $(ninja --version)"
          cmake --version | head -1
          nasm -v
      - name: Build
        env:
          RECORD_SOURCES: ${{ github.workspace }}/builds/sources-${{ matrix.name }}.txt
        run: bash ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.record }}
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unpinned-sources-${{ matrix.name }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The native tests are a need: no release artifact while a fix fails
  # its test.
  release:
    name: Collect release
    needs: [linux, android, windows, apple, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Each build leaves a record of its patches and filters next to its
      # binary, which write_manifest.sh lists with this commit and run.
      - name: Assemble builds/release
        run: |
          mkdir -p builds/release
          find artifacts -type f \( -name 'libmpv_*' -o -name 'build_*.json' \) -exec cp {} builds/release/ \;
          scripts/write_manifest.sh
          ls -la builds/release
      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-release
          path: builds/release/
          if-no-files-found: error

  verify:
    name: Verify
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libmpv-release
          path: builds/release
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/
          target: verify
          tags: mpv-build-verify
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,scope=verify,mode=max
      # The runner's NDK sysroot backs the Android symbol check. Apple
      # binaries get the static checks only, and the aarch64 DLL no load test.
      - name: Verify
        run: |
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          test -d "$sysroot"
          docker run --rm \
            -v "$PWD:/scripts" -w /scripts \
            -v "$sysroot:/ndk-sysroot:ro" \
            mpv-build-verify bash scripts/verify_binaries.sh

  # The Linux x86_64 library on a system without PipeWire and PulseAudio:
  # debian:11 (glibc 2.31, the floor) with only libasound2 added. Initializes
  # a core, lists the audio devices and plays a tone with
  # ao=pipewire,pulse,alsa,null; a stub reaching a missing library aborts.
  # The harness is compiled in a throwaway container, so the test one gets
  # no compiler either.
  linux-runtime:
    name: Linux runtime without PipeWire and PulseAudio
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: builds/release
      - name: Build the harness
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:11 bash -c '
            set -e
            . verify/debian11_apt.sh
            apt_install gcc libc6-dev
            gcc -O0 -o builds/audio_fallback_test verify/audio_fallback_test.c -ldl -lm'
      - name: Run
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w debian:11 bash -c '
            set -e
            . verify/debian11_apt.sh
            apt_install libasound2
            if ldconfig -p | grep -E "libpipewire|libpulse"; then
              echo "PipeWire or PulseAudio present in the image" >&2; exit 1
            fi
            builds/audio_fallback_test builds/release/libmpv_linux-x86_64.so /tmp/tone.wav'

  # The TUI's go vet and go test, and the bash checks of the L13 exit code
  # classification, of the FFmpeg component markers and of the manifest
  # written from the build records. Not in the needs of release: a red test
  # here does not hold back the binaries, it only shows next to them.
  tui:
    name: TUI and verify tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: go vet
        working-directory: tui
        run: go vet ./...
      - name: go test
        working-directory: tui
        run: go test ./...
      - name: L13 exit code classification
        run: bash verify/tests/l13_windows_test.sh
      - name: FFmpeg muxer and protocol markers
        run: bash verify/tests/components_test.sh
      - name: Manifest and build records
        run: bash verify/tests/manifest_test.sh

  # The native tests of the patches, with AddressSanitizer: a debug libmpv
  # with every mpv patch, built against Ubuntu's FFmpeg 6.1, runs the C and
  # white-box tests of verify/tests/native and the patch script tests of
  # verify/tests/patches (run.sh); then, each on a minimal FFmpeg 8.1.1, the
  # filter bounds check and the SMB and TLS checks against impacket's server
  # (network_test.sh). In the needs of release, unlike tui. A failure
  # uploads the logs as native-test-logs.
  native:
    name: Native tests (ASan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # mpv includes the libplacebo headers (video/csputils.h) even with
      # libplacebo optional: the release builds have them from source.
      - name: Install meson, ninja, cmake, FFmpeg, libplacebo and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build cmake pkg-config ffmpeg \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev \
            libswscale-dev libplacebo-dev zlib1g-dev libssl-dev openssl python3-venv
      # The ASan runtime of gcc 13 can crash at start with the 32 bits of
      # mmap randomness of newer kernels.
      - name: Fewer mmap random bits for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: mpv patches
        run: JOBS=4 bash verify/tests/native/run.sh builds/native-tests
      - name: FFmpeg filter bounds
        if: ${{ !cancelled() }}
        run: CC=gcc FFMPEG_TOOLCHAIN=gcc-asan JOBS=4 bash verify/tests/filter_bounds_test.sh builds/filter-bounds
      # impacket is the SMB server of the test, pinned, in a venv of its own.
      - name: FFmpeg SMB and TLS
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv builds/impacket
          builds/impacket/bin/pip install --quiet impacket==0.13.1
          SMB_PYTHON="$PWD/builds/impacket/bin/python" JOBS=4 bash verify/tests/network_test.sh builds/network
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-logs
          path: |
            builds/native-tests/logs/
            builds/native-tests/runs/*.log
            builds/filter-bounds/*.log
            builds/filter-bounds/*.err
            builds/network/logs/
            builds/network/runs/*.log*
          if-no-files-found: ignore
