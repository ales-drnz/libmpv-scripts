name: Build

# Builds every libmpv binary the mpv_audio_kit release ships, on GitHub's
# runners (macOS ones included, so no Mac is needed), collects them with
# manifest.json into one artifact and checks them with verify_binaries.sh.
# Publishing the libmpv-<release> GitHub release stays a manual step.
#
# Lint, the TUI tests and the native tests are the jobs of checks.yml, which
# runs them on every other branch and on the pull requests: here they are
# called, not copied.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every source tarball must be pinned in scripts/shared/_sources.sha256. A
# build that meets an unpinned one stops, and its unpinned-sources-<job>
# artifact holds the line to add.
env:
  STRICT_SOURCES: '1'
  # build-push-action uploads a build record per image as an artifact, which
  # gh run download without a name cannot extract.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

# The jobs only read the repository. The artifacts and the build cache use
# the runner's own token, not GITHUB_TOKEN, so every action is pinned by the
# commit of its release, named in the comment: a tag moved upstream cannot
# change what builds the published binaries. An update changes both.
permissions:
  contents: read

jobs:
  # The binaries stamp LIBMPV_RELEASE in their version: it must be of the
  # form rN on any branch, and a release/rN branch builds rN, so a branch
  # and a stamp that disagree stop here, before the builds.
  release-branch:
    name: Release branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LIBMPV_RELEASE names the branch
        run: bash verify/release_branch.sh "$GITHUB_REF_NAME"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: release-branch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linux image is native-only, so each arch builds on its own.
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/
          target: linux
          tags: mpv-build-linux
          load: true
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-${{ matrix.arch }},mode=max
      - name: Build
        run: |
          docker run --rm \
            -e STRICT_SOURCES -e GITHUB_SHA -e RECORD_SOURCES=/scripts/builds/sources-linux-${{ matrix.arch }}.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-linux bash scripts/build_libmpv_linux.sh --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            builds/release/libmpv_linux-${{ matrix.arch }}.so
            builds/release/build_linux-${{ matrix.arch }}.json
            builds/release/licenses_linux-${{ matrix.arch }}/
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-linux-${{ matrix.arch }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  android:
    name: Android
    needs: release-branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/
          target: android
          tags: mpv-build-android
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
      - name: Build
        run: |
          docker run --rm --platform linux/amd64 \
            -e ABIS="arm64-v8a armeabi-v7a x86_64" \
            -e STRICT_SOURCES -e GITHUB_SHA -e RECORD_SOURCES=/scripts/builds/sources-android.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-android bash scripts/build_libmpv_android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            builds/release/libmpv_android-*.so
            builds/release/build_android-*.json
            builds/release/licenses_android-*/
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-android
          path: builds/sources-*.txt
          if-no-files-found: ignore

  windows:
    name: Windows ${{ matrix.arch }}
    needs: release-branch
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/
          target: windows
          tags: mpv-build-windows
          load: true
          cache-from: type=gha,scope=windows
          cache-to: type=gha,scope=windows,mode=max
      - name: Build
        run: |
          docker run --rm \
            -e STRICT_SOURCES -e GITHUB_SHA -e RECORD_SOURCES=/scripts/builds/sources-windows-${{ matrix.arch }}.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-windows bash scripts/build_libmpv_windows.sh --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            builds/release/libmpv_windows-*.dll
            builds/release/build_windows-*.json
            builds/release/licenses_windows-*/
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-windows-${{ matrix.arch }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The Tizen TVs (armv7l) and their emulator (x86_64): clang against a
  # sysroot of pinned Tizen 6.0 packages, cross from an x86_64 runner.
  tizen:
    name: Tizen ${{ matrix.arch }}
    needs: release-branch
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7l, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/
          target: tizen
          tags: mpv-build-tizen
          load: true
          cache-from: type=gha,scope=tizen
          cache-to: type=gha,scope=tizen,mode=max
      - name: Build
        run: |
          docker run --rm \
            -e STRICT_SOURCES -e GITHUB_SHA -e RECORD_SOURCES=/scripts/builds/sources-tizen-${{ matrix.arch }}.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-tizen bash scripts/build_libmpv_tizen.sh --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tizen-${{ matrix.arch }}
          path: |
            builds/release/libmpv_tizen-*.so
            builds/release/build_tizen-*.json
            builds/release/licenses_tizen-*/
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-tizen-${{ matrix.arch }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The webOS TVs (armv7l, softfp): LG's webOS NDK, which the webos stage
  # installs from LG's release at its checksum. Its licence allows it on our
  # machines only: the image is built without the Actions cache.
  webos:
    name: webOS armv7l
    needs: release-branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/
          target: webos
          tags: mpv-build-webos
          load: true
      - name: Build
        run: |
          docker run --rm \
            -e STRICT_SOURCES -e GITHUB_SHA -e RECORD_SOURCES=/scripts/builds/sources-webos-armv7l.txt \
            -v "$PWD:/scripts" -w /scripts \
            mpv-build-webos bash scripts/build_libmpv_webos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webos-armv7l
          path: |
            builds/release/libmpv_webos-*.so
            builds/release/build_webos-*.json
            builds/release/licenses_webos-*/
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-webos-armv7l
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The image is pinned, so a new macos-latest does not change the
  # toolchain of a release without a commit. Xcode and the brew tools still
  # follow the updates within the label: the Toolchain versions step logs
  # what each build used, and cannot fail the job.
  apple:
    name: ${{ matrix.name }}
    needs: release-branch
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            script: scripts/build_libmpv_macos.sh
            output: builds/release/libmpv_macos.xcframework.zip
            record: builds/release/build_macos.json
            licenses: builds/release/licenses_macos/
          - name: iOS
            script: scripts/build_libmpv_ios.sh
            output: builds/release/libmpv_ios.xcframework.zip
            record: builds/release/build_ios.json
            licenses: builds/release/licenses_ios/
          - name: tvOS
            script: scripts/build_libmpv_tvos.sh
            output: builds/release/libmpv_tvos.xcframework.zip
            record: builds/release/build_tvos.json
            licenses: builds/release/licenses_tvos/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install meson ninja nasm cmake pkg-config autoconf automake libtool
      - name: Toolchain versions
        continue-on-error: true
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          for sdk in macosx iphoneos iphonesimulator appletvos appletvsimulator; do
            echo "$sdk SDK $(xcrun --sdk "$sdk" --show-sdk-version)"
          done
          clang --version | head -1
          echo "meson $(meson --version), ninja $(ninja --version)"
          cmake --version | head -1
          nasm -v
      - name: Build
        env:
          RECORD_SOURCES: ${{ github.workspace }}/builds/sources-${{ matrix.name }}.txt
        run: bash ${{ matrix.script }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.record }}
            ${{ matrix.licenses }}
          if-no-files-found: error
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-${{ matrix.name }}
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The web module: scripts/build_libmpv_web.sh with Emscripten and
  # pthreads, then libmpv_web.zip and build_web.json. Every check of the
  # module runs on the zip as published, in Node and in the runner's Chrome
  # with COOP and COEP (verify/web/run_checks.sh, serve_coi.py and
  # net_server.py): a failed check fails the job, which release needs. The
  # emsdk and the system libraries Emscripten builds at the first link are
  # cached; the archives are built on every run, as on the other targets.
  web:
    name: Web
    needs: release-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version build_libmpv_web.sh pins (EMSDK_VERSION): it stops on
      # another emcc, or on a clang or an emcc.py whose SHA-256 is not the
      # one in _sources.sha256. emsdk itself at the commit of its tag 6.0.12.
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.12
          emsdk-version: 35ff8a6d150541276abbc6bae512ca90bcfbe220
          actions-cache-folder: builds/emsdk-cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builds/em-cache
          key: em-cache-6.0.12-${{ hashFiles('scripts/build_libmpv_web.sh') }}
          restore-keys: em-cache-6.0.12-
      # meson and ninja at the versions of the local builds; ffmpeg makes the
      # fixtures of the checks, brotli measures the module.
      - name: Install meson, ninja, ffmpeg and brotli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg brotli
          python3 -m venv builds/venv
          builds/venv/bin/pip install --quiet meson==1.12.1 ninja==1.13.2
          echo "$PWD/builds/venv/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          RECORD_SOURCES: ${{ github.workspace }}/builds/sources-web.txt
        run: |
          export EM_CACHE="$PWD/builds/em-cache"
          emcc --version | sed -n 1p
          bash scripts/build_libmpv_web.sh
      # The kit's fixtures, at the commit of mpv_audio_kit 0.5.3.
      - name: Check out the fixtures of mpv_audio_kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ales-drnz/mpv_audio_kit
          ref: 66d6d1da7b9a6d047f582e19b285c8cdb7f094ae
          path: builds/kit
          sparse-checkout: test/fixtures
      # Node from the emsdk (the version of the local runs), the runner's
      # Chrome. Ubuntu 24.04 can keep unprivileged user namespaces from
      # Chrome's sandbox.
      - name: Checks
        run: |
          export EM_CACHE="$PWD/builds/em-cache"
          if [[ -n "${EMSDK_NODE:-}" ]]; then export PATH="$(dirname "$EMSDK_NODE"):$PATH"; fi
          node --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          CHROME="$(command -v google-chrome)" || { echo "no google-chrome on the runner"; exit 1; }
          export CHROME
          "$CHROME" --version
          verify/web/make_net_fixtures.sh builds/kit builds/web-fixtures > /dev/null
          mkdir -p builds/web-module
          unzip -q builds/release/libmpv_web.zip -d builds/web-module
          BROWSERS=chrome verify/web/run_checks.sh builds/web-module \
            builds/work/Web/Oz/spike builds/web-fixtures builds/web-checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: |
            builds/release/libmpv_web.zip
            builds/release/build_web.json
            builds/release/licenses_web/
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-check-logs
          path: |
            builds/web-checks/*.txt
            builds/logs/build_web-*.log
          if-no-files-found: ignore
      # The spike of this build, for the Firefox checks.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-spike
          path: |
            builds/work/Web/Oz/spike/spike.mjs
            builds/work/Web/Oz/spike/spike.wasm
          if-no-files-found: error
          retention-days: 3
      # A build stopped by an unpinned source leaves the hash to pin here.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpinned-sources-web
          path: builds/sources-*.txt
          if-no-files-found: ignore

  # The checks of the web module in a headless Firefox, on the zip and the
  # spike the web job built: the browser checks of run_checks.sh, those in
  # Node ran there. Firefox plays into a PulseAudio null sink that is not
  # the default output (verify/web/firefox_sound.sh): its AudioContext runs
  # on that sink's clock. Not a need of release, and its failure does not
  # fail the run, until it has a record: locally the latency check of
  # firefox-audio failed once where Chrome's passes.
  web-firefox:
    name: Web (Firefox)
    needs: web
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: builds/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-spike
          path: builds/web-spike
      - name: Install ffmpeg and PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils
      - name: Check out the fixtures of mpv_audio_kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ales-drnz/mpv_audio_kit
          ref: 66d6d1da7b9a6d047f582e19b285c8cdb7f094ae
          path: builds/kit
          sparse-checkout: test/fixtures
      # Two null sinks: the default output, and mak_tests for Firefox.
      - name: Checks
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_default
          pactl set-default-sink ci_default
          pactl load-module module-null-sink sink_name=mak_tests
          export PULSE_SINK=mak_tests
          node --version
          firefox --version
          verify/web/make_net_fixtures.sh builds/kit builds/web-fixtures > /dev/null
          mkdir -p builds/web-module
          unzip -q builds/release/libmpv_web.zip -d builds/web-module
          BROWSERS=firefox SKIP="webio-logic browser-group ring node-spike node-lib node-net" \
            verify/web/run_checks.sh builds/web-module builds/web-spike builds/web-fixtures \
            builds/web-checks
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-firefox-check-logs
          path: builds/web-checks/*.txt
          if-no-files-found: ignore

  # The web build again with AddressSanitizer on every unit (WEB_SANITIZE),
  # and its Node check of the C harness, which fails on any report
  # (verify/web/run_asan.sh). Not in the needs of release, like checks: the
  # release module is built without it, and a report shows beside the run.
  web-asan:
    name: Web with AddressSanitizer
    needs: release-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.12
          emsdk-version: 35ff8a6d150541276abbc6bae512ca90bcfbe220
          actions-cache-folder: builds/emsdk-cache
      # The sanitized system libraries in a cache of their own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builds/em-cache
          key: em-cache-asan-6.0.12-${{ hashFiles('scripts/build_libmpv_web.sh') }}
          restore-keys: em-cache-asan-6.0.12-
      - name: Install meson, ninja and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv builds/venv
          builds/venv/bin/pip install --quiet meson==1.12.1 ninja==1.13.2
          echo "$PWD/builds/venv/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          export EM_CACHE="$PWD/builds/em-cache"
          WEB_SANITIZE=address BUILD_DIR="$PWD/builds/work/Web/asan" bash scripts/build_libmpv_web.sh
      - name: Check out the fixtures of mpv_audio_kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ales-drnz/mpv_audio_kit
          ref: 66d6d1da7b9a6d047f582e19b285c8cdb7f094ae
          path: builds/kit
          sparse-checkout: test/fixtures
      - name: Checks
        run: |
          if [[ -n "${EMSDK_NODE:-}" ]]; then export PATH="$(dirname "$EMSDK_NODE"):$PATH"; fi
          verify/web/make_net_fixtures.sh builds/kit builds/web-fixtures > /dev/null
          verify/web/run_asan.sh builds/work/Web/asan/release/libmpv_web \
            builds/work/Web/asan/spike builds/web-fixtures builds/web-asan
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-asan-logs
          path: |
            builds/web-asan/*.txt
            builds/logs/build_web-*.log
          if-no-files-found: ignore

  # The native tests and the checks of the web module are needs: no release
  # artifact while a fix fails its test.
  release:
    name: Collect release
    needs: [linux, android, windows, tizen, webos, apple, native, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      # Each build leaves a record of its license, patches and filters and
      # the license texts of what it links next to its binary, which
      # write_manifest.sh lists with this commit and run and packs into
      # licenses.zip.
      - name: Assemble builds/release
        run: |
          mkdir -p builds/release
          find artifacts -type f \( -name 'libmpv_*' -o -name 'build_*.json' \) -not -path '*/licenses_*/*' -exec cp {} builds/release/ \;
          find artifacts -type d -name 'licenses_*' -prune -exec cp -r {} builds/release/ \;
          cp artifacts/struct-layout/struct_layout.json builds/release/
          scripts/write_manifest.sh
          ls -la builds/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-release
          path: builds/release/
          if-no-files-found: error

  verify:
    name: Verify
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-release
          path: builds/release
      # Buildx with the GitHub Actions cache: an unchanged Dockerfile
      # restores the image layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/
          target: verify
          tags: mpv-build-verify
          load: true
          cache-from: type=gha,scope=verify
          cache-to: type=gha,scope=verify,mode=max
      # The runner's NDK sysroot backs the Android symbol check. Apple
      # binaries get the static checks only, and the aarch64 DLL no load test.
      - name: Verify
        run: |
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          test -d "$sysroot"
          docker run --rm \
            -v "$PWD:/scripts" -w /scripts \
            -v "$sysroot:/ndk-sysroot:ro" \
            mpv-build-verify bash scripts/verify_binaries.sh
      # L12 on webOS binds the 32-bit glibc of the NDK's multilib sysroot,
      # which verify took out of the NDK above.
      - name: webOS L12 on the 32-bit userland
        run: |
          docker run --rm -v "$PWD:/scripts" -w /scripts \
            mpv-build-verify bash verify/tests/webos_l12_test.sh

  # The Linux x86_64 library on a system without PipeWire and PulseAudio:
  # debian:11 (glibc 2.31, the floor) with only libasound2 added. Initializes
  # a core, lists the audio devices and plays a tone with
  # ao=pipewire,pulse,alsa,null; a stub reaching a missing library aborts.
  # The harness is compiled in a throwaway container, so the test one gets
  # no compiler either.
  linux-runtime:
    name: Linux runtime without PipeWire and PulseAudio
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: builds/release
      - name: Build the harness
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:11 bash -c '
            set -e
            . verify/debian11_apt.sh
            apt_install gcc libc6-dev
            gcc -O0 -o builds/audio_fallback_test verify/audio_fallback_test.c -ldl -lm'
      - name: Run
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w debian:11 bash -c '
            set -e
            . verify/debian11_apt.sh
            apt_install libasound2
            if ldconfig -p | grep -E "libpipewire|libpulse"; then
              echo "PipeWire or PulseAudio present in the image" >&2; exit 1
            fi
            builds/audio_fallback_test builds/release/libmpv_linux-x86_64.so /tmp/tone.wav'

  # Lint, and the TUI with the tests of verify/tests: the two jobs of
  # checks.yml that no build waits for. Not in the needs of release: a red
  # test there does not hold back the binaries, it only shows next to them.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      only: static

  # The native tests of the patches with AddressSanitizer, the native job of
  # checks.yml. In the needs of release, and its struct-layout artifact goes
  # into manifest.json.
  native:
    name: Native
    needs: release-branch
    uses: ./.github/workflows/checks.yml
    with:
      only: native
